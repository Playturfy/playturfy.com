<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found – Turfy</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="css/style.css?v=7">
  <style>
    .not-found-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .not-found-code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 800;
      color: var(--primary, #C6F432);
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: -0.04em;
    }
    .not-found-title {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: 1rem;
    }
    .not-found-text {
      color: #999;
      max-width: 460px;
      margin-bottom: 2rem;
      font-size: 1rem;
      line-height: 1.6;
    }
  </style>
  <script>
    // Clean URL: strip index.html from address bar for a sleek, clean address
    if (window.location.protocol !== 'file:' && window.location.pathname.endsWith('/index.html')) {
      var clean = window.location.pathname.replace(/\/index\.html$/, '/') + window.location.search + window.location.hash;
      window.history.replaceState(null, '', clean);
    }
  </script>
</head>
<body class="bg-black text-white">
  <header id="header">
    <div class="container header-nav">
      <a href="./" class="brand-link" aria-label="Turfy Homepage">
        <img src="assets/brand-logo.svg" alt="Turfy Logo" class="brand-logo" width="105" height="38">
      </a>
      <div class="nav-actions">
        <a href="./" class="btn btn-lime btn-sm">Home</a>
      </div>
    </div>
  </header>

  <main class="not-found-container">
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">Out of Bounds!</h1>
    <p class="not-found-text">The match has moved or the page you are looking for doesn't exist on this pitch.</p>
    <a href="./" class="btn btn-lime btn-lg">Return to Pitch</a>
  </main>
</body>
</html>
